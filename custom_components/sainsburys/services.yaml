search_products:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    query:
      required: true
      example: semi skimmed milk
      selector:
        text:
    page_number:
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    page_size:
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 100
          mode: box
get_product:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
add_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
    quantity:
      required: false
      default: 1
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box
set_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
remove_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
clear_basket:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
search_slots:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    slot_type:
      required: true
      example: delivery
      selector:
        select:
          options:
            - delivery
            - collection
    week_start_date:
      required: false
      example: "2026-09-07"
      selector:
        date:
    postcode:
      required: false
      example: SW1A 1AA
      selector:
        text:
    store_identifier:
      required: false
      selector:
        text:
    location_uid:
      required: false
      selector:
        text:
reserve_slot:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    slot_type:
      required: true
      example: delivery
      selector:
        select:
          options:
            - delivery
            - collection
    slot_uid:
      required: true
      example: slot-delivery-0630
      selector:
        text:
    start_time:
      required: false
      selector:
        text:
    end_time:
      required: false
      selector:
        text:
    postcode:
      required: false
      selector:
        text:
    store_identifier:
      required: false
      selector:
        text:
    location_uid:
      required: false
      selector:
        text:
