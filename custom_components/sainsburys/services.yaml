search_products:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    query:
      required: true
      example: semi skimmed milk
      selector:
        text:
    page_number:
      required: false
      default: 1
      selector:
        number:
          min: 1
          mode: box
    page_size:
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 100
          mode: box
get_product:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
add_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
    quantity:
      required: false
      default: 1
      selector:
        number:
          min: 0.01
          step: 0.01
          mode: box
set_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
remove_basket_item:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
    product_uid:
      required: true
      example: "3236048"
      selector:
        text:
clear_basket:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sainsburys
